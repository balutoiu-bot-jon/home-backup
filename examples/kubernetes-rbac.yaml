# Replace `backup` with the namespace containing the home-backup CronJob and
# `media` with the namespace containing the source PVC. If they are the same,
# the two namespaced Roles may be combined.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-backup-longhorn-runner
  namespace: backup
rules:
  # Required to detect the current CronJob through Pod -> Job -> CronJob owners.
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - secrets
    verbs:
      - get
      - create
      - delete
      - list
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - create
      - delete
      - list
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - get
      - create
      - delete
      - list
---
# The RoleBinding grants the parent runner broad lifecycle permissions. Copied
# child Jobs retain this ServiceAccount name for image-pull and identity metadata,
# but home-backup disables token automount and strips inherited projected API
# tokens/mounts from every child container, so the backup workload cannot use
# these Kubernetes API permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-backup-longhorn-runner
  namespace: backup
subjects:
  - kind: ServiceAccount
    name: home-backup
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-backup-longhorn-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-backup-longhorn-source
  namespace: media
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - get
      - create
      - delete
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-backup-longhorn-source
  namespace: media
subjects:
  - kind: ServiceAccount
    name: home-backup
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-backup-longhorn-source
---
# VolumeSnapshotContent is cluster-scoped. The alias uses deletionPolicy Retain
# and is deleted explicitly after the restored PVC is removed. Cluster-wide list
# is required by stale-run reconciliation, which filters and validates the
# durable runner-scope label plus the alias volumeSnapshotRef namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: home-backup-longhorn-snapshot-alias
rules:
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshotcontents
    verbs:
      - get
      - create
      - delete
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: home-backup-longhorn-snapshot-alias
subjects:
  - kind: ServiceAccount
    name: home-backup
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: home-backup-longhorn-snapshot-alias
